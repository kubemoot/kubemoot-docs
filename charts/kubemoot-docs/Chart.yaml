apiVersion: v2
name: kubemoot-docs
description: Hugo/Docsy documentation site for the Kubemoot ecosystem
type: application

# Versions live only in git tags: git holds 0.0.0, and each build stamps the version it
# computed into the chart it packages (rl_stamp_chart), never committing it.
version: 0.0.0
appVersion: 0.0.0

keywords:
  - kubemoot
  - docs
  - documentation

home: https://github.com/kubemoot/kubemoot-docs
sources:
  - https://github.com/kubemoot/kubemoot-docs

maintainers:
  - name: Kubemoot maintainers
    email: moot@kubemoot.org
