# Default values for kubemoot-docs
# This is a YAML-formatted file.

# Application image configuration
image:
  registry: ghcr.io
  repository: kubemoot/docs
  # Empty: the tag defaults to the appVersion, which the release stamps from the git tag
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Pull secrets for image.registry. Empty for a public registry; a private
# mirror sets its own secret name here.
imagePullSecrets: []

# Number of replicas — one is sufficient for a static site
replicaCount: 1

# Service account — no cluster access needed; docs is static HTML
serviceAccount:
  create: true
  name: kubemoot-docs
  annotations: {}

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Gateway API configuration — mirrors the kubemoot-dashboard pattern
gateway:
  enabled: true
  name: gateway
  namespace: default
  hostnames:
    - kubemoot.example.com
  pathPrefix: /docs

# Resource limits — nginx serving static files is very lightweight
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Security context for the pod
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Security context for the container. nginx listens on 8080 as the image's user
# (1002:1001, the buildpacks run image's cnb user) and writes only under /tmp, an
# emptyDir, so the root filesystem is read-only.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1002
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /docs/
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /docs/
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}
