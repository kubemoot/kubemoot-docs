# The whole nginx configuration of the docs image. The Paketo nginx buildpack starts
# `nginx -p /workspace -c /workspace/nginx.conf -g "pid /tmp/nginx.pid;"` as a non-root
# user, with the built site in /workspace/public. The root filesystem is read-only, so
# nginx writes only under /tmp. The buildpack renders this file as a Go template at
# start; it uses no template actions, so the file stays unchanged and is never written.
# scripts/check-nginx.sh serves the built site with it.
worker_processes 1;
daemon off;
error_log stderr;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_body_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;

  charset utf-8;
  access_log /dev/stdout;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;
  # Redirects keep the scheme, host and port the client used (the Gateway in front).
  absolute_redirect off;

  # The media types a Hugo and Docsy site serves.
  types {
    text/html html htm;
    text/css css;
    text/xml xml;
    text/plain txt;
    application/javascript js mjs;
    application/json json map;
    application/rss+xml rss;
    application/atom+xml atom;
    application/manifest+json webmanifest;
    application/pdf pdf;
    image/svg+xml svg svgz;
    image/png png;
    image/jpeg jpeg jpg;
    image/gif gif;
    image/webp webp;
    image/avif avif;
    image/x-icon ico;
    font/woff woff;
    font/woff2 woff2;
    font/ttf ttf;
    font/otf otf;
    application/vnd.ms-fontobject eot;
    application/wasm wasm;
    application/zip zip;
    application/gzip gz;
    text/csv csv;
    application/yaml yaml yml;
    video/mp4 mp4;
    video/webm webm;
  }

  gzip on;
  gzip_min_length 1100;
  gzip_types text/css text/plain text/xml application/javascript application/json
    application/rss+xml application/atom+xml image/svg+xml;
  gzip_vary on;

  server {
    listen 8080;
    server_name _;

    # The Hugo site is built with a ROOT baseURL. The content's own "docs/" section
    # provides the /docs/ path; the Cilium Gateway HTTPRoute forwards /docs/* here
    # unchanged (pathPrefix, no strip), so /docs/introduction/ resolves to
    # public/docs/introduction/. Building with --baseURL .../docs/ AND a docs/ section
    # would double the prefix (/docs/docs/...), which breaks every in-page link.
    root public;
    index index.html;

    # Health check endpoint for the Kubernetes probes
    location = /docs/healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # Redirect bare /docs to /docs/ so the docs landing loads correctly
    location = /docs {
      return 301 /docs/;
    }

    # Dotfiles are never served, except .well-known/.
    location ~ /\.(?!well-known) {
      return 404;
    }

    location / {
      # HTML is never fingerprinted: make browsers revalidate it on every visit so a
      # rebuilt page replaces the cached one without a hard refresh.
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ =404;

      # Cache fingerprinted static assets aggressively.
      location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
      }
    }

    error_page 404 /404.html;
  }
}
