server {
    # nginx-unprivileged serves as a non-root user on 8080 (no NET_BIND_SERVICE).
    listen 8080;
    server_name _;

    # The Hugo site is built with a ROOT baseURL and copied to the web root.
    # The content's own "docs/" section provides the /docs/ path; the Cilium
    # Gateway HTTPRoute forwards /docs/* here unchanged (pathPrefix, no strip),
    # so /docs/introduction/ resolves to /usr/share/nginx/html/docs/introduction/.
    # Building with --baseURL .../docs/ AND a docs/ section would double the
    # prefix (/docs/docs/...), which broke every in-page link.
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint for the Kubernetes probes
    location = /docs/healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Redirect bare /docs to /docs/ so the docs landing loads correctly
    location = /docs {
        return 301 /docs/;
    }

    location / {
        # HTML is never fingerprinted: make browsers revalidate it on every visit so a
        # rebuilt page replaces the cached one without a hard refresh.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;

        # Cache fingerprinted static assets aggressively.
        location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    error_page 404 /404.html;
}
