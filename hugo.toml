baseURL = "https://kubemoot.org/"
title = "Kubemoot"
enableRobotsTXT = true
enableGitInfo = false

# Single language (English) for now.
contentDir = "content/en"
defaultContentLanguage = "en"

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    title = "Kubemoot"

[markup]
  [markup.goldmark.renderer]
    unsafe = true           # allow raw HTML in markdown
  [markup.highlight]
    # CSS classes, not inline colors: Docsy's code styles (assets/scss) then color
    # code for light and dark mode.
    noClasses = false
    lineNos = false

# Module config: imports and mounts.
# The component docs are mounted from ../kubemoot/docs. Locally that is the
# sibling submodule in the umbrella; in CI/Docker the build places the
# checked-out component docs at that path before running Hugo.
# See "Standalone build" in README.md.
[module]
  proxy = "direct"
  [[module.imports]]
    path = "github.com/google/docsy"
  [[module.imports]]
    path = "github.com/google/docsy/dependencies"
  # Site shell mounts - always present in every environment:
  [[module.mounts]]
    source = "content/en"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  # Component docs from the sibling path. Locally `kubemoot` is a sibling
  # submodule; in CI/Docker the build places the checked-out docs there first.
  [[module.mounts]]
    source = "../kubemoot/docs"
    target = "content/docs"
    files = ['! **/CLAUDE.md', '! README.md']

[params]
  copyright = "The Kubemoot Authors"
  # Rendered in the footer as the "License" link (label set in i18n/en.toml).
  privacy_policy = "https://github.com/kubemoot/kubemoot-docs/blob/main/LICENSE"
  github_repo = "https://github.com/kubemoot/kubemoot"
  github_subdir = "docs"
  offlineSearch = true
  [params.ui]
    breadcrumb_disable = false
    sidebar_menu_compact = false
    sidebar_search_disable = false
    navbar_logo = true      # assets/icons/logo.svg, the full-color brand icon (brand.lock)
    showLightDarkModeMenu = true   # Light, Dark, System, top right of the navbar
  # Footer doors. Docsy renders params.links.user on the left, .developer on the right.
  [params.links]
    [[params.links.user]]
      name = "moot@kubemoot.org"
      url = "mailto:moot@kubemoot.org"
      icon = "fa fa-envelope"
      desc = "Questions, speaking, press: everything that is not a bug or a vulnerability"
    [[params.links.user]]
      name = "Community"
      url = "/docs/community/"
      icon = "fa fa-users"
      desc = "Contributing, governance, conduct, security, and releases"
    [[params.links.user]]
      name = "Discussions"
      url = "https://github.com/orgs/kubemoot/discussions"
      icon = "fa fa-comments"
      desc = "Ask and answer in the open"
    [[params.links.developer]]
      name = "GitHub"
      url = "https://github.com/kubemoot"
      icon = "fab fa-github"
      desc = "The kubemoot organization: operator, crews, CLI, this site"
    [[params.links.developer]]
      name = "security@kubemoot.org"
      url = "mailto:security@kubemoot.org"
      icon = "fa fa-shield-halved"
      desc = "Report a vulnerability privately"

[menu]
