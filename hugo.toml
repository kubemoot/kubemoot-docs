  # developer sites use: install, try, learn, read, integrate, drive, look up.
  [[menu.main]]
    name = "Install"
    weight = 10
    url = "/docs/introduction/installation/"
  [[menu.main]]
    name = "Quickstart"
    weight = 20
    url = "/docs/introduction/quickstart/"
  [[menu.main]]
    name = "Tutorials"
    weight = 30
    url = "/docs/user-guides/"
  [[menu.main]]
    name = "Documentation"
    weight = 40
    url = "/docs/"
  [[menu.main]]
    name = "Integrations"
    weight = 50
    url = "/docs/integrations/"
  [[menu.main]]
    name = "CLI"
    weight = 60
    url = "/docs/reference/kmctl/"
  [[menu.main]]
    name = "API"
    weight = 70
    url = "/docs/reference/"
  [[menu.main]]
    name = "Community"
    weight = 80
    url = "/docs/community/"
