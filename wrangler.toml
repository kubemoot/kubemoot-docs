# kubemoot.org: the built Hugo site served as static assets by one Cloudflare Worker.
# Deployed by .github/workflows/site.yaml with `wrangler deploy` once the repository
# variable SITE_DEPLOY is "true" (set at the open-source flip). The custom domains are
# attached by Cloudflare on first deploy; no DNS record is managed by hand.
# Until then the same Worker serves the coming-soon page: `wrangler deploy --assets soon`.
name = "kubemoot-org"
compatibility_date = "2026-09-24"
workers_dev = false
# worker/index.js redirects www.kubemoot.org to the apex (301, path kept) and passes every
# other request to the static assets below. Tests: node --test worker/index.test.js
main = "worker/index.js"

[assets]
directory = "./public"
not_found_handling = "404-page"   # unknown paths get public/404.html with a 404 status
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "kubemoot.org"
custom_domain = true

[[routes]]
pattern = "www.kubemoot.org"
custom_domain = true
