<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15">
  <title id="t">How the pieces fit together</title>
  <desc id="d">One Kubernetes cluster contains two nodes. Kubemoot and NATS run on one node. The model server, vLLM or Ollama, runs on the node with the accelerator and is reached through a Service. A ModelServer resource names that Service. Kubemoot reads the ModelServer and sends model calls to the Service.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="752" height="392" rx="14" fill="#e8f1fb" stroke="#326ce5" stroke-width="2"/>
  <text x="22" y="30" font-weight="700" fill="#1a3a6b">One Kubernetes cluster</text>

  <rect x="24" y="48" width="320" height="214" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
  <text x="40" y="74" font-weight="700" fill="#263238">A node: any machine</text>
  <rect x="44" y="92" width="280" height="62" rx="8" fill="#d7ecd9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="184" y="119" text-anchor="middle" font-weight="700" fill="#1b3a1e">Kubemoot</text>
  <text x="184" y="140" text-anchor="middle" fill="#1b3a1e">operator and agents</text>
  <rect x="44" y="172" width="280" height="62" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="184" y="199" text-anchor="middle" font-weight="700" fill="#263238">NATS</text>
  <text x="184" y="220" text-anchor="middle" fill="#263238">the message bus the agents use</text>

  <rect x="416" y="48" width="320" height="214" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>
  <text x="432" y="74" font-weight="700" fill="#263238">Node with the accelerator</text>
  <rect x="436" y="92" width="280" height="62" rx="8" fill="#fff3d6" stroke="#b26a00" stroke-width="1.5"/>
  <text x="576" y="119" text-anchor="middle" font-weight="700" fill="#4a2c00">Service</text>
  <text x="576" y="140" text-anchor="middle" fill="#4a2c00">a stable name inside the cluster</text>
  <rect x="436" y="172" width="280" height="62" rx="8" fill="#fde2e0" stroke="#c62828" stroke-width="1.5"/>
  <text x="576" y="199" text-anchor="middle" font-weight="700" fill="#5a1210">Model server</text>
  <text x="576" y="220" text-anchor="middle" fill="#5a1210">vLLM or Ollama, installed separately</text>
  <line x1="576" y1="154" x2="576" y2="172" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="184" y="312" width="392" height="62" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="380" y="339" text-anchor="middle" font-weight="700" fill="#2a1860">ModelServer</text>
  <text x="380" y="360" text-anchor="middle" fill="#2a1860">a Kubemoot resource that names the Service</text>

  <path d="M44 123 L34 123 L34 343 L184 343" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="44" y="333" fill="#37474f">1. reads</text>
  <path d="M576 343 L746 343 L746 123 L716 123" fill="none" stroke="#37474f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="596" y="333" fill="#37474f">2. names</text>
  <path d="M324 123 L436 123" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="380" y="112" text-anchor="middle" font-size="13" fill="#1b3a1e">3. model calls</text>
</svg>
