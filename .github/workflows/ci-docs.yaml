name: CI Docs Site

on:
  workflow_call:
    outputs:
      kubemoot_sha:
        description: The kubemoot commit whose docs/ the site was built with
        value: ${{ jobs.site.outputs.kubemoot_sha }}
  pull_request:
    branches: [main]
    paths:
      - '**.toml'
      - '**.html'
      - '**.md'
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'go.mod'
      - 'go.sum'
      - '.hugo-version'
      - 'nginx.conf'
      - 'scripts/check-nginx.sh'
      - 'charts/**'
      - 'brand.lock'
      - 'scripts/brand-sync*.sh'
      - '.github/assets/**'
      - '.github/actions/build-site/**'
      - '.github/workflows/ci-docs.yaml'
      - '.github/workflows/release-docs.yaml'
      - '.github/workflows/publish-release.yaml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/docs

permissions:
  contents: read

jobs:
  # The site builds on a GitHub-hosted runner for every event, exactly as the public
  # site does (the build-site action), and nginx serves it with the image's nginx.conf.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      kubemoot_sha: ${{ steps.kubemoot.outputs.sha }}

    steps:
      - name: Checkout kubemoot-docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site

      # The logo, landing mark, favicons, and README lockups are copies of github.com/kubemoot/.github
      # brand/ files; brand.lock pins the commit and each copy's sha256.
      - name: Check the brand copies against brand.lock
        working-directory: site
        run: scripts/brand-sync.sh check && scripts/brand-sync.test.sh

      # Versions live only in git tags; a kubemoot docs change rebuilds without a commit.
      - name: Test the release rules
        working-directory: site
        run: scripts/release.test.sh

      # hugo.toml mounts the operator docs from ../kubemoot/docs, so the component
      # checkout sits beside the site directory. Sparse: only docs/ is fetched.
      - name: Checkout kubemoot docs (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubemoot/kubemoot
          # KUBEMOOT_READ_TOKEN is used when the repo secret is set; fork pull
          # requests get no secrets and read the public kubemoot repo with
          # github.token.
          token: ${{ secrets.KUBEMOOT_READ_TOKEN || github.token }}
          sparse-checkout: docs
          sparse-checkout-cone-mode: true
          path: kubemoot

      - name: Record the kubemoot docs commit
        id: kubemoot
        run: |
          sha="$(git -C kubemoot rev-parse HEAD)"
          echo "Kubemoot docs @ ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # Pull requests build for kubemoot.org; the image is the private preview.
      - name: Build the site
        uses: ./site/.github/actions/build-site
        with:
          site-dir: site
          site-url: ${{ github.event_name != 'pull_request' && vars.PREVIEW_SITE_URL || 'https://kubemoot.org/' }}

      - name: Test the nginx check
        run: site/scripts/check-nginx.test.sh

      - name: Serve the site with the image's nginx.conf
        run: site/scripts/check-nginx.sh site/public site/nginx.conf

      # What the image packages: the built site and the nginx configuration.
      - name: Stage the image source
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${RUNNER_TEMP}/image"
          cp site/nginx.conf "${RUNNER_TEMP}/image/"
          cp -R site/public "${RUNNER_TEMP}/image/public"

      - name: Upload the image source
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-image
          path: ${{ runner.temp }}/image
          include-hidden-files: true
          retention-days: 1

  # The Paketo nginx buildpack packages the built site with nginx in the cluster and
  # pushes the image to Harbor: main pushes :<sha>, which the release retags, and
  # :latest; any other ref pushes only :branch-<sha>.
  image:
    needs: site
    if: github.event_name != 'pull_request'
    runs-on: homelab-runners

    steps:
      - name: Download the image source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-image
          path: ${{ runner.temp }}/image

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up the build helpers
        uses: kubemoot/release-actions/setup@7d1fcd865e059e89051a7f8c8c14745f02140d3a # agent/build-image

      - name: Build and push with Paketo buildpacks
        env:
          REGISTRY_HOST_IP: ${{ vars.REGISTRY_HOST_IP }}
          SHA: ${{ github.sha }}
          KUBEMOOT_SHA: ${{ needs.site.outputs.kubemoot_sha }}
        run: |
          "${BUILD_IMAGE_DIR}/build-image-buildpacks.sh" \
            --pod "buildpacks-docs-${SHA:0:8}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            --sha "${SHA}" --ref "${GITHUB_REF}" \
            --builder builder --run-image run-base \
            --buildpack paketo-buildpacks/web-servers \
            --env BP_OCI_SOURCE=https://github.com/kubemoot/kubemoot-docs \
            --env "BP_OCI_REVISION=${SHA}" \
            --env BP_OCI_LICENSES=Apache-2.0 \
            --env "BP_IMAGE_LABELS=org.kubemoot.docs.kubemoot-revision=${KUBEMOOT_SHA}" \
            "${RUNNER_TEMP}/image" "${REGISTRY}/${IMAGE_NAME}"
