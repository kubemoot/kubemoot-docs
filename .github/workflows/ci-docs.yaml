name: CI Docs Site

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - '**.toml'
      - '**.html'
      - '**.md'
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'config/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'charts/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: harbor-homelab.dijure.com
  IMAGE_NAME: kubemoot/docs
  HUGO_VERSION: "0.156.0"

jobs:
  build:
    runs-on: homelab-runners

    steps:
      - name: Checkout kubemoot-docs
        uses: actions/checkout@v5

      # Aggregate component docs into _docs/ so the default hugo.toml mounts work.
      # Only the docs/ subdirectory of each component repo is needed; sparse checkout
      # keeps the clone fast and avoids pulling large binary assets.
      - name: Checkout kubemoot docs (sparse)
        uses: actions/checkout@v5
        with:
          repository: javajon-homelab/kubemoot
          # GITHUB_TOKEN is scoped to this repo only and cannot read the private
          # kubemoot repo; a fine-grained PAT with read:contents on kubemoot is
          # required (repo secret KUBEMOOT_READ_TOKEN).
          token: ${{ secrets.KUBEMOOT_READ_TOKEN }}
          sparse-checkout: docs
          sparse-checkout-cone-mode: true
          path: _docs/kubemoot

      # The Hugo build happens entirely inside the Dockerfile (Kaniko) below, so
      # the runner needs no Go/Node/Hugo toolchain. The sparse-checked-out
      # component docs (_docs/kubemoot) ride along in the Kaniko build context.
      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Ensure Harbor project exists
        if: github.event_name != 'pull_request'
        run: |
          curl -s -X POST "http://${{ env.REGISTRY }}/api/v2.0/projects" \
            -H "Content-Type: application/json" \
            -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            -d '{"project_name": "kubemoot", "public": false}' \
            --fail-with-body || true

      - name: Build and push with Kaniko
        if: github.event_name != 'pull_request'
        run: |
          SHA="${{ github.sha }}"
          JOB_NAME="kaniko-docs-$(echo ${SHA} | cut -c1-8)-${GITHUB_RUN_NUMBER}"

          # Build context = repo root; Dockerfile references _docs/ for the docs content
          tar --exclude='.git' --exclude='node_modules' --exclude='public' --exclude='resources' \
              -czf /tmp/context.tar.gz .

          kubectl run ${JOB_NAME} \
            --rm -i \
            --restart=Never \
            --namespace=arc-runners \
            --image=gcr.io/kaniko-project/executor:latest \
            --overrides='{
              "spec": {
                "hostAliases": [{"ip": "192.168.50.210", "hostnames": ["harbor-homelab.dijure.com"]}],
                "containers": [{
                  "name": "kaniko",
                  "image": "gcr.io/kaniko-project/executor:latest",
                  "stdin": true,
                  "stdinOnce": true,
                  "args": [
                    "--context=tar://stdin",
                    "--dockerfile=Dockerfile",
                    "--destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:'"${SHA}"'",
                    "--destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest",
                    "--insecure",
                    "--skip-tls-verify",
                    "--cache=false"
                  ],
                  "volumeMounts": [{"name": "docker-config", "mountPath": "/kaniko/.docker"}]
                }],
                "volumes": [{"name": "docker-config", "secret": {"secretName": "kaniko-docker-config", "items": [{"key": "config.json", "path": "config.json"}]}}]
              }
            }' < /tmp/context.tar.gz
