name: CI Docs Site

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - '**.toml'
      - '**.html'
      - '**.md'
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'charts/**'
      - 'brand.lock'
      - 'scripts/brand-sync*.sh'
      - '.github/assets/**'
      - '.github/workflows/ci-docs.yaml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/docs

permissions:
  contents: read

jobs:
  build:
    # Pull requests (including forks) run on GitHub-hosted runners; the self-hosted
    # cluster runners take push, dispatch, and workflow_call runs from main only.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runners' }}

    steps:
      - name: Checkout kubemoot-docs
        uses: actions/checkout@v5

      # The logo, landing mark, favicons, and README lockups are copies of github.com/kubemoot/.github
      # brand/ files; brand.lock pins the commit and each copy's sha256.
      - name: Check the brand copies against brand.lock
        run: scripts/brand-sync.sh check && scripts/brand-sync.test.sh

      # Aggregate component docs into _docs/ so the default hugo.toml mounts work.
      # Only the docs/ subdirectory of each component repo is needed; sparse checkout
      # keeps the clone fast and avoids pulling large binary assets.
      - name: Checkout kubemoot docs (sparse)
        uses: actions/checkout@v5
        with:
          repository: kubemoot/kubemoot
          # KUBEMOOT_READ_TOKEN is used when the repo secret is set; fork pull
          # requests get no secrets and read the public kubemoot repo with
          # github.token.
          token: ${{ secrets.KUBEMOOT_READ_TOKEN || github.token }}
          sparse-checkout: docs
          sparse-checkout-cone-mode: true
          path: _docs/kubemoot

      # The Hugo build happens entirely inside the Dockerfile, so the runner needs
      # no Go/Node/Hugo toolchain. The sparse-checked-out component docs
      # (_docs/kubemoot) ride along in the build context. Pull requests build the
      # same Dockerfile with Docker on the hosted runner and push nothing.
      - name: Build site (pull request)
        if: github.event_name == 'pull_request'
        run: docker build --build-arg SITE_URL=https://kubemoot.org/ -t kubemoot-docs:pr .

      - name: Install kubectl
        if: github.event_name != 'pull_request'
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Ensure Harbor project exists
        if: github.event_name != 'pull_request'
        run: |
          curl -s -X POST "http://${{ env.REGISTRY }}/api/v2.0/projects" \
            -H "Content-Type: application/json" \
            -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            -d '{"project_name": "kubemoot", "public": false}' \
            --fail-with-body || true

      - name: Build and push with Kaniko
        if: github.event_name != 'pull_request'
        run: |
          SHA="${{ github.sha }}"
          JOB_NAME="kaniko-docs-$(echo "${SHA}" | cut -c1-8)-${GITHUB_RUN_NUMBER}"

          # Build context = repo root; Dockerfile references _docs/ for the docs content
          tar --exclude='.git' --exclude='node_modules' --exclude='public' --exclude='resources' \
              -czf /tmp/context.tar.gz .

          kubectl run "${JOB_NAME}" \
            --rm -i \
            --restart=Never \
            --namespace=arc-runners \
            --image=gcr.io/kaniko-project/executor:latest \
            --overrides='{
              "spec": {
                "hostAliases": [{"ip": "${{ vars.REGISTRY_HOST_IP }}", "hostnames": ["${{ vars.REGISTRY }}"]}],
                "containers": [{
                  "name": "kaniko",
                  "image": "gcr.io/kaniko-project/executor:latest",
                  "stdin": true,
                  "stdinOnce": true,
                  "args": [
                    "--context=tar://stdin",
                    "--dockerfile=Dockerfile",
                    "--build-arg=SITE_URL=${{ vars.PREVIEW_SITE_URL || 'https://kubemoot.org/' }}",
                    "--destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:'"${SHA}"'",
                    "--destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest",
                    "--insecure",
                    "--skip-tls-verify",
                    "--cache=false"
                  ],
                  "volumeMounts": [{"name": "docker-config", "mountPath": "/kaniko/.docker"}]
                }],
                "volumes": [{"name": "docker-config", "secret": {"secretName": "kaniko-docker-config", "items": [{"key": "config.json", "path": "config.json"}]}}]
              }
            }' < /tmp/context.tar.gz
