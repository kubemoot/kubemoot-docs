name: Release Docs Site

on:
  push:
    branches: [main]
    paths:
      - '**.toml'
      - '**.html'
      - '**.md'
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'config/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'charts/**'
      - '!**/CLAUDE.md'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/docs

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-docs.yaml
    secrets: inherit

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate the release candidate version
        id: version
        uses: kubemoot/release-actions/release-candidate-version@cee9e2e1fd27c0cc9196578af77dd7b07a585e4f # v0.1.0
        with:
          tag_prefix: "docs-v"
          force: ${{ inputs.force_release }}

      - name: Install crane
        if: steps.version.outputs.release_created == 'true'
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Install Helm
        if: steps.version.outputs.release_created == 'true'
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Retag image with version
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ github.sha }}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "${HARBOR_PASSWORD}" | crane auth login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          if crane manifest --insecure "${FULL_IMAGE}:${SHA}" >/dev/null 2>&1; then
            echo "Copying ${FULL_IMAGE}:${SHA} -> ${FULL_IMAGE}:${VERSION}"
            crane copy --insecure "${FULL_IMAGE}:${SHA}" "${FULL_IMAGE}:${VERSION}"
          elif crane manifest --insecure "${FULL_IMAGE}:latest" >/dev/null 2>&1; then
            echo "Copying ${FULL_IMAGE}:latest -> ${FULL_IMAGE}:${VERSION}"
            crane copy --insecure "${FULL_IMAGE}:latest" "${FULL_IMAGE}:${VERSION}"
          fi

      - name: Update Helm chart version
        if: steps.version.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating Helm chart to version: $VERSION"

          sed -i "s/^version:.*/version: $VERSION/" charts/kubemoot-docs/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: $VERSION/" charts/kubemoot-docs/Chart.yaml

          echo "Updated Chart.yaml:"
          grep -E "^(version|appVersion):" charts/kubemoot-docs/Chart.yaml

      - name: Package and push Helm chart
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_REGISTRY="oci://${{ env.REGISTRY }}/kubemoot/charts"

          echo "Packaging Helm chart..."
          helm package charts/kubemoot-docs

          echo "Logging in to Harbor OCI registry..."
          echo "${HARBOR_PASSWORD}" | helm registry login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          echo "Pushing Helm chart to ${CHART_REGISTRY}..."
          helm push --insecure-skip-tls-verify kubemoot-docs-${VERSION}.tgz ${CHART_REGISTRY}

      - name: Commit chart changes
        if: steps.version.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet charts/; then
            echo "No chart changes to commit"
          else
            git add charts/
            git commit -m "chore: update docs Helm chart to v$VERSION [skip ci]"
          fi

      - name: Create and push tag
        if: steps.version.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="docs-v$VERSION"

          # Land the chart commit on main first, rebasing onto any commit that landed
          # meanwhile, then tag that commit. A push that cannot land fails the job, so
          # a release never ends without its tag.
          pushed=false
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then pushed=true; break; fi
            echo "git push rejected (attempt ${attempt}/8); rebasing onto origin/main and retrying"
            git pull -q --rebase origin main
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ] || { echo "::error::could not land the docs chart ${VERSION} on main"; exit 1; }

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote"
          else
            git tag -a "$TAG" -m "Release candidate Kubemoot Docs Site $TAG"
            git push origin "refs/tags/$TAG"
          fi

