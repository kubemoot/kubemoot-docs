name: Release Docs Site

on:
  push:
    branches: [main]
    paths:
      - '**.toml'
      - '**.html'
      - '**.md'
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'config/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'charts/**'
      - '!**/CLAUDE.md'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: harbor-homelab.dijure.com
  IMAGE_NAME: kubemoot/docs

jobs:
  ci:
    uses: ./.github/workflows/ci-docs.yaml
    secrets: inherit

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate semantic version
        id: version
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: "docs-v"
          major_pattern: "(BREAKING CHANGE|feat!|fix!)"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true
          search_commit_body: true

      - name: Check if release needed
        id: check
        run: |
          echo "Current version: ${{ steps.version.outputs.version }}"
          echo "Changed: ${{ steps.version.outputs.changed }}"

          if [ "${{ steps.version.outputs.changed }}" = "true" ] || [ "${{ inputs.force_release }}" = "true" ]; then
            echo "release_created=true" >> $GITHUB_OUTPUT
            echo "Will create release docs-v${{ steps.version.outputs.version }}"
          else
            echo "release_created=false" >> $GITHUB_OUTPUT
            echo "Skipping release - no version-bumping commits since last tag"
          fi

      - name: Install crane
        if: steps.check.outputs.release_created == 'true'
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Install Helm
        if: steps.check.outputs.release_created == 'true'
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Retag image with version
        if: steps.check.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ github.sha }}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "${HARBOR_PASSWORD}" | crane auth login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          if crane manifest --insecure "${FULL_IMAGE}:${SHA}" >/dev/null 2>&1; then
            echo "Copying ${FULL_IMAGE}:${SHA} -> ${FULL_IMAGE}:${VERSION}"
            crane copy --insecure "${FULL_IMAGE}:${SHA}" "${FULL_IMAGE}:${VERSION}"
          elif crane manifest --insecure "${FULL_IMAGE}:latest" >/dev/null 2>&1; then
            echo "Copying ${FULL_IMAGE}:latest -> ${FULL_IMAGE}:${VERSION}"
            crane copy --insecure "${FULL_IMAGE}:latest" "${FULL_IMAGE}:${VERSION}"
          fi

      - name: Update Helm chart version
        if: steps.check.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating Helm chart to version: $VERSION"

          sed -i "s/^version:.*/version: $VERSION/" charts/kubemoot-docs/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: $VERSION/" charts/kubemoot-docs/Chart.yaml

          echo "Updated Chart.yaml:"
          grep -E "^(version|appVersion):" charts/kubemoot-docs/Chart.yaml

      - name: Package and push Helm chart
        if: steps.check.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_REGISTRY="oci://${{ env.REGISTRY }}/kubemoot/charts"

          echo "Packaging Helm chart..."
          helm package charts/kubemoot-docs

          echo "Logging in to Harbor OCI registry..."
          echo "${HARBOR_PASSWORD}" | helm registry login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          echo "Pushing Helm chart to ${CHART_REGISTRY}..."
          helm push --insecure-skip-tls-verify kubemoot-docs-${VERSION}.tgz ${CHART_REGISTRY}

      - name: Commit chart changes
        if: steps.check.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet charts/; then
            echo "No chart changes to commit"
          else
            git add charts/
            git commit -m "chore: update docs Helm chart to v$VERSION [skip ci]"
          fi

      - name: Create and push tag
        if: steps.check.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="docs-v$VERSION"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally, skipping"
          elif git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Tag $TAG already exists on remote, skipping"
          else
            echo "Creating tag: $TAG"
            git tag -a "$TAG" -m "Release Kubemoot Docs Site $TAG"
          fi

          git push origin main --follow-tags || {
            echo "Push failed, attempting without tags..."
            git push origin main || true
          }

      - name: Create GitHub Release
        if: steps.check.outputs.release_created == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docs-v${{ steps.version.outputs.version }}
          name: Kubemoot Docs Site v${{ steps.version.outputs.version }}
          body: |
            Kubemoot Docs Site v${{ steps.version.outputs.version }}

            Hugo/Docsy documentation site for the Kubemoot ecosystem.

            ## Container Image
            ```
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ```

            ## Helm Chart
            ```bash
            helm install kubemoot-docs oci://${{ env.REGISTRY }}/kubemoot/charts/kubemoot-docs --version ${{ steps.version.outputs.version }}
            ```
          draft: false
          prerelease: false
