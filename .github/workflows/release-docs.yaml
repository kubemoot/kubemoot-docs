name: Release Docs Site

on:
  push:
    branches: [main]
    paths:
      - '**.toml'
      - '**.html'
      - '**.md'
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'go.mod'
      - 'go.sum'
      - '.hugo-version'
      - 'nginx.conf'
      - '.github/actions/build-site/**'
      - 'charts/**'
      - 'brand.lock'
      - 'scripts/brand-sync*.sh'
      - '!**/CLAUDE.md'
  # kubemoot's trigger-docs-rebuild.yaml sends this when kubemoot/docs changes on main:
  # the site is rebuilt from this repository's unchanged main as a new candidate.
  repository_dispatch:
    types: [kubemoot-docs-changed]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: kubemoot/docs

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-docs.yaml
    secrets: inherit

  release:
    needs: ci
    runs-on: homelab-runners
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes the tag even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate the release candidate version
        id: version
        uses: kubemoot/release-actions/release-candidate-version@71225d1c899d63a0c66500eeb798433b137ebe4f # v0.8.1
        with:
          tag_prefix: "docs-v"
          # A kubemoot docs change has no commit here: force the next free candidate.
          force: ${{ inputs.force_release || github.event_name == 'repository_dispatch' }}

      - name: Install crane
        if: steps.version.outputs.release_created == 'true'
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Install Helm
        if: steps.version.outputs.release_created == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.14.0'

      - name: Retag image with version
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ github.sha }}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "${HARBOR_PASSWORD}" | crane auth login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          # The image this run's CI built; never another build's :latest.
          if ! crane manifest --insecure "${FULL_IMAGE}:${SHA}" >/dev/null 2>&1; then
            echo "::error::${FULL_IMAGE}:${SHA} was not built"
            exit 1
          fi
          echo "Copying ${FULL_IMAGE}:${SHA} -> ${FULL_IMAGE}:${VERSION}"
          crane copy --insecure "${FULL_IMAGE}:${SHA}" "${FULL_IMAGE}:${VERSION}"

      # Git holds 0.0.0; the build stamps the candidate version into the chart it
      # packages and never commits it. The image tag defaults to the appVersion.
      - name: Stamp the chart version
        if: steps.version.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # shellcheck source=/dev/null
          source "${RELEASE_LIB}"
          rl_stamp_chart charts/kubemoot-docs "${VERSION}"
          grep -E "^(version|appVersion):" charts/kubemoot-docs/Chart.yaml

      - name: Package and push Helm chart
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_REGISTRY="oci://${{ env.REGISTRY }}/kubemoot/charts"

          echo "Packaging Helm chart..."
          helm package charts/kubemoot-docs

          echo "Logging in to Harbor OCI registry..."
          echo "${HARBOR_PASSWORD}" | helm registry login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          echo "Pushing Helm chart to ${CHART_REGISTRY}..."
          helm push --insecure-skip-tls-verify kubemoot-docs-${VERSION}.tgz ${CHART_REGISTRY}

      - name: Create and push tag
        if: steps.version.outputs.release_created == 'true'
        env:
          # The site builds kubemoot's main as it is now, which can be newer than the
          # commit that sent a dispatch; this is the commit the build actually used.
          KUBEMOOT_SHA: ${{ needs.ci.outputs.kubemoot_sha }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="docs-v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The tag marks the commit this run built; nothing is committed back to main.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote"
          else
            git tag -a "$TAG" -m "Release candidate Kubemoot Docs Site $TAG" \
              -m "Built with kubemoot docs @ ${KUBEMOOT_SHA}" "${GITHUB_SHA}"
            git push origin "refs/tags/$TAG"
          fi
