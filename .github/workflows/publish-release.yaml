# Publish Release: publish the tested docs release candidate to kubemoot.org.
#
# Every push to main builds a docs release candidate (docs-vX.Y.Z-rc.N) into Harbor,
# and the private preview runs it. A maintainer runs this workflow (Actions tab, Run
# workflow; dispatch needs write access) to publish the candidate's image and chart to
# Harbor as the final X.Y.Z (the homelab moves to it), tag the candidate's commit
# docs-vX.Y.Z, build the public site from that commit with the Kubemoot docs of the latest
# published Kubemoot release, deploy it to kubemoot.org (when SITE_DEPLOY is "true"),
# and write the GitHub Release. The default is a dry run: the site is built and
# checked, the notes are in the run summary, and nothing is tagged or deployed.
name: Publish Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: '"latest", or a docs-vX.Y.Z-rc.N tag on main'
        required: true
        default: latest
        type: string
      dry_run:
        description: 'Dry run: build the site and show the notes, publish nothing'
        required: true
        default: true
        type: boolean

# This repository's product is its documentation, so docs commits belong in the notes.
env:
  RL_NOTES_DOCS: "true"

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # The same runners as every release in the ecosystem, and only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: homelab-runners
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      kubemoot_ref: ${{ steps.kubemoot.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_TOKEN (contents and workflows write) lets the final tag land on the
          # candidate's commit when workflow files changed on main after it; the default
          # token is refused there. Falls back to the default token.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@71225d1c899d63a0c66500eeb798433b137ebe4f # v0.8.1

      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.14.0'

      # The homelab moves from the candidate to the identical final: the candidate's
      # image gets the final tag in Harbor (a copy, never a rebuild), and the chart from
      # the candidate's commit is stamped with the final version and pushed to Harbor.
      # Done before tagging, so a failed publish leaves no final tag; if tagging fails
      # afterwards, a re-run copies and pushes the same final again. The dry run
      # packages the chart and publishes nothing.
      - name: Package the final chart
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE_NAME: kubemoot/docs
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          # shellcheck source=/dev/null
          source "${RELEASE_LIB}"
          plan="$(DRY_RUN=true rl_promote_single docs-v "Kubemoot docs" "$(mktemp -d)")"
          final="$(sed -n 's/^final_tag=docs-v//p' <<<"${plan}")"
          commit="$(sed -n 's/^commit=//p' <<<"${plan}")"
          rc="$(sed -n 's/^rc_tag=docs-v//p' <<<"${plan}")"
          [ -n "${final}" ] && [ -n "${commit}" ] && [ -n "${rc}" ] \
            || { echo "::error::could not plan the release: ${plan}"; exit 1; }

          rl_checkout_at "${commit}"
          trap rl_remove_worktrees EXIT
          rl_stamp_chart "${RL_CHECKOUT}/charts/kubemoot-docs" "${final}"
          helm package "${RL_CHECKOUT}/charts/kubemoot-docs" --destination final-chart
          echo "Final chart: $(ls final-chart) from ${rc} (commit ${commit})" | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run: the final image and chart are not published"
            exit 0
          fi
          FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}"
          echo "${HARBOR_PASSWORD}" | crane auth login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          crane copy --insecure "${FULL_IMAGE}:${rc}" "${FULL_IMAGE}:${final}"
          echo "${HARBOR_PASSWORD}" | helm registry login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          helm push --insecure-skip-tls-verify "final-chart/kubemoot-docs-${final}.tgz" "oci://${REGISTRY}/kubemoot/charts"

      - name: Tag the final version
        id: tag
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          OUT_DIR: release-files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # shellcheck source=/dev/null
          source "${RELEASE_LIB}"
          rl_promote_single docs-v "Kubemoot docs" "${OUT_DIR}" >> "$GITHUB_OUTPUT"
          cat "${OUT_DIR}/notes.md" >> "$GITHUB_STEP_SUMMARY"

      # The public site documents released Kubemoot: its docs/ come from the latest
      # published Kubemoot release (operator-chart-vA.B.C, or before the first release
      # the latest vX.Y.Z operator release), not from Kubemoot's main.
      - name: Find the latest Kubemoot release
        id: kubemoot
        env:
          TOKEN: ${{ secrets.KUBEMOOT_READ_TOKEN }}
        run: |
          tags=$(git ls-remote --tags --refs "https://${TOKEN:+x-access-token:${TOKEN}@}github.com/kubemoot/kubemoot.git" \
            | awk '{sub("refs/tags/", "", $2); print $2}')
          ref=$(grep -E '^operator-chart-v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags" | sort -V | tail -n 1 || true)
          [ -n "$ref" ] || ref=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags" | sort -V | tail -n 1 || true)
          [ -n "$ref" ] || { echo "no Kubemoot release tag found"; exit 1; }
          echo "Kubemoot docs from ${ref}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Keep the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: release-files/
          retention-days: 30

  site:
    needs: publish
    uses: ./.github/workflows/site.yaml
    with:
      ref: ${{ needs.publish.outputs.commit }}
      kubemoot_ref: ${{ needs.publish.outputs.kubemoot_ref }}
      deploy: ${{ !inputs.dry_run }}
    secrets: inherit

  release:
    needs: [publish, site]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release-files

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release-files/releases.tsv: tag, title, notes file (one release per line).
          while IFS=$'\t' read -r tag title notes; do
            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "${tag} already has a release"
              continue
            fi
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
              --title "${title}" --notes-file "release-files/${notes}"
          done < release-files/releases.tsv
