# kubemoot.org: build the site on a GitHub-hosted runner from this shell plus the
# component docs, prove it renders, and publish it as a Cloudflare Worker serving
# static assets. Nothing here touches the homelab.
#
# A push to main (or a dispatch) only builds and checks the site. Promote Release calls
# this workflow with the promoted commit, the Kubemoot release whose docs it carries,
# and deploy: true; the deploy then runs once SITE_DEPLOY is "true". The private
# preview (release-docs.yaml) keeps tracking main.
name: Site

on:
  push:
    branches: [main]
    paths:
      - '**.toml'
      - '**.html'
      - '**.md'
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/site.yaml'
      - '!**/CLAUDE.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit of this repository to build'
        required: true
        type: string
      kubemoot_ref:
        description: 'Tag or commit of kubemoot/kubemoot whose docs/ to build with'
        required: true
        type: string
      deploy:
        description: 'Publish to kubemoot.org (when SITE_DEPLOY is "true")'
        required: false
        default: false
        type: boolean

# Builds from main replace each other; a deploy is never cancelled.
concurrency:
  group: site-${{ inputs.deploy && 'deploy' || 'build' }}
  cancel-in-progress: ${{ !inputs.deploy }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SITE_URL: https://kubemoot.org/

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the site shell
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: site

      # hugo.toml mounts the operator docs from ../kubemoot/docs, so the component
      # checkout sits beside the site directory. Sparse: only docs/ is fetched.
      - name: Checkout kubemoot docs (sparse)
        uses: actions/checkout@v7
        with:
          repository: kubemoot/kubemoot
          token: ${{ secrets.KUBEMOOT_READ_TOKEN || github.token }}
          ref: ${{ inputs.kubemoot_ref }}
          sparse-checkout: docs
          sparse-checkout-cone-mode: true
          path: kubemoot

      # The Dockerfile's ENV HUGO_VERSION is the single Hugo version source.
      - name: Read the Hugo version from the Dockerfile
        id: hugo
        run: |
          version=$(sed -n 's/^ENV HUGO_VERSION=//p' site/Dockerfile)
          test -n "${version}" || { echo "::error::ENV HUGO_VERSION not found in Dockerfile"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build
        working-directory: site
        run: |
          npm ci
          # No `hugo mod get`: it upgrades Docsy past the go.mod pin. The build
          # downloads the pinned module versions itself.
          hugo --gc --minify --baseURL "$SITE_URL"

      - name: Prove the site rendered
        working-directory: site
        run: |
          pages=$(find public -name index.html | wc -l)
          echo "pages=$pages"
          test -f public/index.html
          test -f public/docs/index.html
          test -f public/docs/introduction/quickstart/index.html
          [ "$pages" -ge 60 ] || { echo "only $pages pages rendered; the component docs mount is probably empty" >&2; exit 1; }
          echo "### Site build" >> "$GITHUB_STEP_SUMMARY"
          echo "$pages pages rendered for $SITE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/public
          retention-days: 7

  deploy:
    needs: build
    if: inputs.deploy && vars.SITE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the site shell (for wrangler.toml)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: public

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
