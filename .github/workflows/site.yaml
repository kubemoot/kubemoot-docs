# kubemoot.org: build the site on a GitHub-hosted runner from this shell plus the
# component docs, prove it renders, and publish it as a Cloudflare Worker serving
# static assets. Nothing here touches the homelab.
#
# A push to main (or a dispatch) only builds and checks the site. Publish Release calls
# this workflow with the released commit, the Kubemoot release whose docs it carries,
# and deploy: true; the deploy then runs once SITE_DEPLOY is "true". The private
# preview (release-docs.yaml) keeps tracking main.
name: Site

on:
  push:
    branches: [main]
    paths:
      - '**.toml'
      - '**.html'
      - '**.md'
      - 'content/**'
      - 'layouts/**'
      - 'static/**'
      - 'assets/**'
      - 'worker/**'
      - 'scripts/check-site.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'go.mod'
      - 'go.sum'
      - '.hugo-version'
      - '.github/actions/build-site/**'
      - '.github/workflows/site.yaml'
      - '!**/CLAUDE.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit of this repository to build'
        required: true
        type: string
      kubemoot_ref:
        description: 'Tag or commit of kubemoot/kubemoot whose docs/ to build with'
        required: true
        type: string
      deploy:
        description: 'Publish to kubemoot.org (when SITE_DEPLOY is "true")'
        required: false
        default: false
        type: boolean

# Builds from main replace each other; a deploy is never cancelled.
concurrency:
  group: site-${{ inputs.deploy && 'deploy' || 'build' }}
  cancel-in-progress: ${{ !inputs.deploy }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SITE_URL: https://kubemoot.org/

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the site shell
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: site

      # hugo.toml mounts the operator docs from ../kubemoot/docs, so the component
      # checkout sits beside the site directory. Sparse: only docs/ is fetched.
      - name: Checkout kubemoot docs (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubemoot/kubemoot
          token: ${{ secrets.KUBEMOOT_READ_TOKEN || github.token }}
          ref: ${{ inputs.kubemoot_ref }}
          sparse-checkout: docs
          sparse-checkout-cone-mode: true
          path: kubemoot

      - name: Build the site
        uses: ./site/.github/actions/build-site
        with:
          site-dir: site
          site-url: ${{ env.SITE_URL }}

      - name: Check the SEO files, tags, and llms.txt links
        working-directory: site
        run: |
          scripts/check-site.sh public
          node --test worker/index.test.js

      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/public
          retention-days: 7

  deploy:
    needs: build
    if: inputs.deploy && vars.SITE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the site shell (for wrangler.toml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: public

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
