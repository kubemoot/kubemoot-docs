name: Docs problem
description: A docs page says something wrong or outdated.
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: "This repository covers the docs site at kubemoot.org and its content. A bug in the software itself belongs in [kubemoot/kubemoot](https://github.com/kubemoot/kubemoot/issues/new/choose). Use this form for content that exists but is wrong; a missing topic belongs in Docs request, and a broken link or layout in Site problem."
  - type: checkboxes
    id: searched
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and did not find this one
          required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: The address of the page in your browser
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the text, and say what is true instead if you know.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: New wording or a pointer to the right answer is welcome.
    validations:
      required: false
